<body>
  <main class="app">
    <header class="top"><div class="brand"><span class="brand-mark">⌁</span><span>PREDICȚII PRO</span></div><div id="feed-state" class="feed-state">Se încarcă feedul…</div></header>
    <section id="today" class="view active"></section>
    <section id="explore" class="view"></section>
    <section id="strategies" class="view"></section>
    <section id="journal" class="view"></section>
  </main>
  <nav class="bottom-nav" aria-label="Navigare principală"><button class="nav-button active" data-tab="today"><i>◈</i>Azi</button><button class="nav-button" data-tab="explore"><i>⌕</i>Explorare</button><button class="nav-button" data-tab="strategies"><i>▣</i>Strategii</button><button class="nav-button" data-tab="journal"><i>◷</i>Jurnal</button></nav>
  <div id="sheet-backdrop" class="sheet-backdrop"></div><aside id="analysis-sheet" class="sheet" aria-label="Analiză meci"></aside><div id="toast" class="toast" role="status"></div>
  <script>
    const STORE={selected:'predictii-pro:selected',tickets:'predictii-pro:tickets',pyramids:'predictii-pro:pyramids',journal:'predictii-pro:journal'};
    let feed={events:[],status:'awaiting_sync',message:'Feedul se încarcă.',calls:0,updatedAt:null};
    const state={tab:'today',strategy:'tickets',filter:'all',marketType:'all',competition:'all',query:'',limit:12,analysisId:null,ticketTarget:1.4,ticketStake:10,pyramidMode:'single'};
    const requestedTab=new URLSearchParams(window.location.search).get('tab');if(['today','explore','strategies','journal'].includes(requestedTab))state.tab=requestedTab;
    const requestedStrategy=new URLSearchParams(window.location.search).get('strategy');if(['tickets','pyramids'].includes(requestedStrategy))state.strategy=requestedStrategy;
    const $=id=>document.getElementById(id),read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}},save=(key,value)=>localStorage.setItem(key,JSON.stringify(value)),round=n=>Number(Number(n).toFixed(2)),number=v=>Number.isFinite(Number(v))?Number(v):0,escape=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const selectedIds=()=>read(STORE.selected,[]),allSelections=()=>feed.events.flatMap(event=>(event.selections||[]).map(selection=>({...selection,event}))),selectionById=id=>allSelections().find(item=>item.id===id),strategiesAvailable=()=>feed.status==='ready',prudentTargetEligible=item=>Boolean(item&&item.odds>=1.2&&item.odds<=1.7&&number(item.expectedValue)>0&&number(item.edge)>=1&&number(item.contextScore)>=55&&number(item.confidence)>=55&&number(item.probability)>=58),strategyEligible=(item,target=number(state.ticketTarget)||1.4)=>Boolean(strategiesAvailable()&&(target>=5?prudentTargetEligible(item):item?.eligible)),selectedObjects=()=>{const events=new Set(),competitions=new Set(),target=number(state.ticketTarget)||1.4,allowLeagueReuse=target>=5;return selectedIds().map(selectionById).filter(item=>{if(!strategyEligible(item,target)||events.has(item.eventId)||(!allowLeagueReuse&&competitions.has(item.event.competition)))return false;events.add(item.eventId);competitions.add(item.event.competition);return true})},eligible=()=>strategiesAvailable()?allSelections().filter(selection=>selection.eligible):[],prudentEligible=()=>strategiesAvailable()?allSelections().filter(prudentTargetEligible):[],fmtDate=value=>new Date(value).toLocaleString('ro-RO',{dateStyle:'medium',timeStyle:'short'}),fmtTime=value=>new Date(value).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});
    const journal=(type,title,detail)=>{const entries=read(STORE.journal,[]);entries.unshift({id:crypto.randomUUID(),type,title,detail,createdAt:new Date().toISOString()});save(STORE.journal,entries.slice(0,30))};
    const showToast=text=>{const toast=$('toast');toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2800)};
    function feedLabel(){const label=feed.status==='ready'?'Feed verificat':feed.status==='partial'?'Feed parțial':'Feed indisponibil';$('feed-state').innerHTML=`<strong>${label}</strong>${feed.updatedAt?fmtDate(feed.updatedAt):'Fără sincronizare validă'}`}
    const riskSummary=()=>{const items=eligible();const uniqueCompetitions=new Set(items.map(item=>item.event.competition)).size;return{eligible:items.length,coverage:feed.events.length?round(items.length/feed.events.length*100):0,competitions:uniqueCompetitions}};
    const priorityScore=item=>number(item.expectedValue)*4+number(item.edge)*2+number(item.probability)/10+number(item.confidence)/20;
    const prioritySelections=()=>[...eligible()].sort((a,b)=>priorityScore(b)-priorityScore(a)).slice(0,3);
    const hasSignals=event=>(event.providerSignals||[]).length>0;
    const recommended=event=>Boolean(event.providerRecommended)||(event.selections||[]).some(item=>item.recommendation&&item.recommendation!=='watch');
    const high=event=>number(event.providerConfidence)>=60||(event.providerSignals||[]).some(signal=>number(signal.probability)>=70);
    const marketType=item=>{const market=String(item.market||'').toLowerCase(),outcome=String(item.outcome||'').toUpperCase();if(market==='1x2')return'1x2';if(market.startsWith('over_under'))return outcome==='OVER'?'over':outcome==='UNDER'?'under':'other';if(market==='btts')return'btts';return'other'};
    function matchesMarketType(event){return state.marketType==='all'||(event.selections||[]).some(item=>marketType(item)===state.marketType)}
    function marketItems(event){return(event.selections||[]).filter(item=>state.marketType==='all'||marketType(item)===state.marketType)}
    function matchesFilter(event){if(state.filter==='signals')return hasSignals(event);if(state.filter==='priced')return(event.selections||[]).length>0;if(state.filter==='eligible')return(event.selections||[]).some(item=>item.eligible);if(state.filter==='recommended')return recommended(event);if(state.filter==='high')return high(event);return true}
    function visibleEvents(){const query=state.query.trim().toLocaleLowerCase('ro');return feed.events.filter(event=>{const text=`${event.homeTeam} ${event.awayTeam} ${event.competition}`.toLocaleLowerCase('ro');return(state.competition==='all'||event.competition===state.competition)&&matchesFilter(event)&&matchesMarketType(event)&&(!query||text.includes(query))}).slice(0,state.limit)}
    function ticketSummary(items){const odds=round(items.reduce((total,item)=>total*item.odds,1)),probability=round(items.reduce((total,item)=>total*(item.probability/100),1)*100),value=round((probability/100*odds-1)*100);return{odds,probability,value}}

    function ticketSummary(items,stake=number(state.ticketStake)||10){const odds=items.length?round(items.reduce((total,item)=>total*item.odds,1)):0,probability=items.length?round(items.reduce((total,item)=>total*(item.probability/100),1)*100):0,value=odds?round((probability/100*odds-1)*100):0,potentialReturn=round(stake*odds),potentialProfit=odds?round(potentialReturn-stake):0,impliedProbability=odds?round(100/odds):0;return{odds,probability,value,potentialReturn,potentialProfit,impliedProbability,stake}}

    const baseDecorateTicketPolicy=decorateTicketPolicy;decorateTicketPolicy=function(){baseDecorateTicketPolicy();if(!strategiesAvailable()){const form=$('ticket-target')?.closest('.form-grid');if(form&&!document.querySelector('.feed-unavailable-note'))form.insertAdjacentHTML('afterend',`<div class="integrity feed-unavailable-note"><i>i</i><span><strong>Strategii blocate temporar.</strong> Ultima sincronizare nu este validă; cotele afișate pot fi consultate în analiză, dar nu pot fi adăugate, propuse sau salvate până la următorul feed verificat.</span></div>`)}}
    function renderTicketWorkspace(){const items=selectedObjects(),target=number(state.ticketTarget)||1.4,stake=number(state.ticketStake)||10,summary=ticketSummary(items,stake),status=ticketStatus(summary,target),available=eligible().slice().sort((a,b)=>priorityScore(b)-priorityScore(a));return `<div class="workspace"><section class="panel"><div class="panel-body"><p class="eyebrow">Acumulator verificat</p><div class="section-head"><div><h2>Cota ta, calculată instant.</h2><p class="subtle">Ținta, miza şi fiecare selecție actualizează automat calculatorul. Strategia folosește doar cote reale eligibile.</p></div></div><div class="ticket-hero"><div class="ticket-total"><span>Cotă totală</span><b>${summary.odds?summary.odds.toFixed(2):'—'}</b><small>${items.length}/4 selecții · ${items.length?'toate prețurile sunt verificate':'așteaptă prima piață eligibilă'}</small></div><div class="ticket-target"><span>Cotă țintă</span><b>${target.toFixed(2)}</b><span class="tag ${status.tone==='green'?'green':''}">${status.label}</span></div></div><div class="odds-progress"><div class="odds-progress-head"><span>Progres cotă</span><b>${summary.odds?`${summary.odds.toFixed(2)} / ${target.toFixed(2)}`:'0.00 / '+target.toFixed(2)}</b></div><div class="odds-track"><div class="odds-fill" style="width:${status.progress}%"></div></div><p class="ticket-note">Interval real permis: ${status.lower.toFixed(2)}–${status.upper.toFixed(2)} · diferență față de țintă: ${summary.odds?(status.delta>=0?'+':'')+status.delta.toFixed(2):'—'} · ${status.text}</p></div><div class="metric-grid ticket-metrics"><div class="metric emphasis"><b>${summary.potentialReturn.toFixed(2)} u.</b><span>retur potențial</span></div><div class="metric"><b>${summary.potentialProfit.toFixed(2)} u.</b><span>profit potențial</span></div><div class="metric"><b>${summary.probability}%</b><span>probabilitate combinată</span></div><div class="metric"><b>${summary.value>=0?'+':''}${summary.value}%</b><span>valoare estimată</span></div     function openAnalysis(id){state.analysisId=id;const item=selectionById(id);if(item)journal('analysis',`${item.event.homeTeam} — ${item.event.awayTeam}`,`${item.label} · cotă ${item.odds.toFixed(2)}`);renderSheet()}
    function toggleSelection(id){if(!strategiesAvailable()){showToast('Feedul nu este valid acum; cotele stale pot fi analizate, dar nu intră în strategie.');return}const next=new Set(selectedIds()),candidate=selectionById(id);if(next.has(id)){next.delete(id);save(STORE.selected,[...next]);renderAll();showToast('Piața a fost eliminată din spațiul de strategie.');return}if(!candidate)return;if(!strategyEligible(candidate)){showToast('Cota este reală, dar nu respectă criteriile curente pentru strategie.');return}const current=selectedObjects(),policy=ticketPolicy(number(state.ticketTarget)||1.4);if(current.length>=policy.max){showToast(`Ținta selectată permite cel mult ${policy.max} selecții distincte.`);return}if(current.some(item=>item.eventId===candidate.eventId)){showToast('Acumulatorul permite o singură piață pentru același eveniment.');return}if(!policy.allowLeagueReuse&&current.some(item=>item.event.competition===candidate.event.competition)){showToast('Pentru țintele sub 5,00 păstrăm competițiile distincte pentru a limita corelația.');return}next.add(id);save(STORE.selected,[...next]);renderAll();showToast(policy.allowLeagueReuse?'Piața verificată a fost adăugată; riscul de concentrare pe competiție rămâne vizibil.':'Piața verificată a fost adăugată în spațiul de strategie.')}
    function suggestTicket(){if(!strategiesAvailable()){save(STORE.selected,[]);renderAll();showToast('Feedul nu este valid acum; nu propunem combinații din cote stale.');return}const target=number($('ticket-target').value)||1.4,policy=ticketPolicy(target),lower=policy.lower,upper=policy.upper,candidates=allSelections().filter(item=>strategyEligible(item,target)).sort((a,b)=>priorityScore(b)-priorityScore(a)),eventCount=new Set(candidates.map(item=>item.eventId)).size,eventLabel=eventCount===1?'meci distinct':'meciuri distincte';if(target>=5&&eventCount<2){save(STORE.selected,[]);renderAll();showToast(`Mod prudent: este disponibil doar ${eventCount} ${eventLabel} cu cote 1,20–1,70 care trece toate pragurile. Așteptăm acoperire reală înainte de o combinație.`);return}let best=null,fallback=null;const consider=chosen=>{const summary=ticketSummary(chosen);if(!summary.odds)return;const quality=chosen.reduce((total,item)=>total+priorityScore(item),0),competitionCount=new Set(chosen.map(item=>item.event.competition)).size,concentration=Math.max(0,chosen.length-competitionCount),fallbackScore=summary.odds*100+quality-concentration*8;if(!fallback||fallbackScore>fallback.score)fallback={chosen:[...chosen],summary,competitionCount,score:fallbackScore};if(summary.odds<lower||summary.odds>upper)return;const score=Math.abs(summary.odds-target)*100-quality+concentration*8;if(!best||score<best.score)best={chosen:[...chosen],summary,competitionCount,score}};const search=(start,chosen,usedEvents,usedCompetitions)=>{if(chosen.length)consider(chosen);if(chosen.length>=policy.max||ticketSummary(chosen).odds>=upper)return;for(let index=start;index<candidates.length;index+=1){const item=candidates[index],competition=item.event.competition;if(usedEvents.has(item.eventId)||(!policy.allowLeagueReuse&&usedCompetitions.has(competition)))continue;search(index+1,[...chosen,item],new Set([...usedEvents,item.eventId]),new Set([...usedCompetitions,competition]))}};search(0,[],new Set(),new Set());const proposal=best||fallback;if(!proposal){showToast('Nu există încă piețe reale care trec filtrul acestei ținte.');return}save(STORE.selected,proposal.chosen.map(item=>item.id));const exact=Boolean(best),concentrated=proposal.competitionCount<proposal.chosen.length;journal('strategy',exact?'Combinație prudentă propusă':'Acoperire prudentă propusă',`${proposal.chosen.length}/${policy.max} meciuri distincte · cotă ${proposal.summary.odds.toFixed(2)}${concentrated?' · competiție concentrată':''}`);renderAll();if(exact){showToast(`Combinația prudentă a fost adăugată: ${proposal.chosen.length} meciuri distincte şi cote reale mici.`)}else{showToast(`Ținta ${target.toFixed(2)} nu este încă atinsă cu cotele prudente disponibile. Nu adăugăm cote ridicate pentru a completa artificial biletul.`)}}
    function bindTickets(){decorateTicketPolicy();$('ticket-target').onchange=event=>{state.ticketTarget=number(event.target.value)||1.4;renderStrategies()};$('ticket-stake').onchange=event=>{const stake=number(event.target.value);if(stake>=1){state.ticketStake=stake;renderStrategies()}};$('suggest-ticket').onclick=suggestTicket;$('clear-selection').onclick=()=>{save(STORE.selected,[]);renderAll();showToast('Selecția de lucru a fost golită.')};$('save-ticket').onclick=()=>{if(!strategiesAvailable()){showToast('Feedul nu este valid acum; nu salvăm acumulatoare din cote stale.');return}const items=selectedObjects();if(!items.length){showToast('Selectează mai întâi o piață cu cotă verificată.');return}const stake=number($('ticket-stake').value)||10,target=number($('ticket-target').value)||1.4;state.ticketStake=stake;state.ticketTarget=target;const summary=ticketSummary(items,stake),tickets=read(STORE.tickets,[]);tickets.unshift({id:crypto.randomUUID(),createdAt:new Date().toISOString(),stake,target,items,odds:summary.odds,probability:summary.probability,value:summary.value,potentialReturn:summary.potentialReturn,potentialProfit:summary.potentialProfit});save(STORE.tickets,tickets);save(STORE.selected,[]);journal('ticket','Acumulator salvat',`${items.length} selecții · cotă ${summary.odds.toFixed(2)} · miză locală ${stake.toFixed(2)}`);renderAll();showToast('Acumulatorul a fost salvat local, fără decontare automată inventată.')}}
    function bindPyramids(){decoratePyramidUpgrade();document.querySelectorAll('[data-pyramid-mode]').forEach(button=>button.onclick=()=>{const active=read(STORE.pyramids,[]).find(plan=>plan.status==='active');if(active){showToast('Modul planului activ rămâne fixat la crearea lui. Creează un plan nou pentru alt mod.');return}state.pyramidMode=button.dataset.pyramidMode;renderStrategies()});$('create-pyramid').onclick=()=>{const plans=read(STORE.pyramids,[]),target=Math.min(3,Math.max(1.2,number($('pyramid-odds').value)||1.3)),plan={id:crypto.randomUUID(),target,mode:state.pyramidMode,steps:Math.min(31,Math.max(1,number($('pyramid-steps').value)||5)),stake:number($('pyramid-stake').value)||10,reinvest:Math.min(100,Math.max(5,number($('pyramid-reinvest').value)||50)),currentStep:1,status:'active',selectionId:null,selectionIds:[]};plans.unshift(plan);save(STORE.pyramids,plans);journal('pyramid','Piramidă creată',`${plan.steps} pași · cotă ${plan.target.toFixed(2)} · ${plan.mode==='combo'?'combinație 2–3':'piață unică'}`);renderAll();showToast('Planul de piramidă a fost creat local.')};const attach=$('attach-recommendation');if(attach)attach.onclick=()=>{const plans=read(STORE.pyramids,[]),active=plans.find(plan=>plan.status==='active'),candidate=active&&pyramidCandidate(active.target);if(!active||!candidate)return;active.selectionId=candidate.id;active.selectionIds=[candidate.id];active.status='tracking';save(STORE.pyramids,plans);journal('pyramid','Selecție asociată pasului activ',`${candidate.event.homeTeam} — ${candidate.event.awayTeam} · ${candidate.odds.toFixed(2)}`);renderAll();showToast('Selecția verificată a fost asociată pasului activ.')};const attachCombo=$('attach-combo-recommendation');if(attachCombo)attachCombo.onclick=()=>{const plans=read(STORE.pyramids,[]),active=plans.find(plan=>plan.status==='active'),combo=active&&pyramidComboCandidate(active.target);if(!active||!combo)return;active.selectionId=combo.items[0].id;active.selectionIds=combo.items.map(item=>item.id);active.status='tracking';save(STORE.pyramids,plans);journal('pyramid','Combinație asociată pasului activ',`${combo.items.length} piețe verificate · cotă ${combo.odds.toFixed(2)}`);renderAll();showToast('Combinația verificată a fost asociată pasului activ.')};document.querySelectorAll('[data-delete-pyramid]').forEach(button=>button.onclick=()=>{if(!confirm('Ștergi această piramidă locală? Acțiunea nu poate fi anulată.'))return;save(STORE.pyramids,read(STORE.pyramids,[]).filter(plan=>plan.id!==button.dataset.deletePyramid));journal('pyramid','Piramidă ștearsă','Plan local eliminat de utilizator.');renderAll();showToast('Piramida a fost ștearsă.')})}
    function bindShared(){document.querySelectorAll('[data-analyze]').forEach(button=>button.onclick=()=>openAnalysis(button.dataset.analyze));document.querySelectorAll('[data-select]').forEach(button=>button.onclick=()=>toggleSelection(button.dataset.select));document.querySelectorAll('[data-go]').forEach(button=>button.onclick=()=>{state.tab=button.dataset.go;renderAll()})}
    function renderAll(){feedLabel();document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id===state.tab));document.querySelectorAll('.nav-button').forEach(button=>button.classList.toggle('active',button.dataset.tab===state.tab));renderToday();renderExplore();renderStrategies();renderJournal();renderSheet()}
    document.querySelectorAll('.nav-button').forEach(button=>button.onclick=()=>{state.tab=button.dataset.tab;window.scrollTo({top:0,behavior:'smooth'});renderAll()});$('sheet-backdrop').onclick=closeSheet;
    fetch('./data/feed.json',{cache:'no-store'}).then(response=>response.ok?response.json():Promise.reject()).then(data=>{feed=data;renderAll()}).catch(()=>{feed={events:[],status:'unavailable',message:'Feedul static nu poate fi citit momentan.',calls:0,updatedAt:null};renderAll()});
  </script>

name: Actualizează feedul static Predicții Pro

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predictii-pro-static-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generează feedul fără a expune cheia
        env:
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
        run: node scripts/update-pages-feed.mjs
      - name: Salvează numai modificarea feedului static
        run: |
          if git diff --quiet -- docs/data/feed.json; then
            echo "Feedul nu s-a modificat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/feed.json
          git commit -m "chore: actualizează feedul static"
          git push

name: Publish GitHub Pages portal

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
